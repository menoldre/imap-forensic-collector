# Config for the local Dovecot test container (docker/docker-compose.yml).
[source]
host = 127.0.0.1
port = 9993
user = tester
ca_cert = docker/certs/server.crt
# password: set IMAP_PASSWORD=testpass

[collection]
output_dir = ./collection_{user}_{date}
folders = ALL
examiner = Test Examiner
case_id = TEST-LOCAL
