# Minimal Dovecot 2.3 config for collector testing. Not for production.
protocols = imap
listen = *

log_path = /dev/stderr
info_log_path = /dev/stdout
auth_verbose = yes

ssl = required
ssl_cert = </etc/dovecot/certs/server.crt
ssl_key = </etc/dovecot/certs/server.key
disable_plaintext_auth = yes
auth_mechanisms = plain login

# Same layout as OpenSRS/hostedemail: "." hierarchy delimiter, INBOX. prefix.
mail_home = /srv/mail/%u
mail_location = maildir:~/Maildir
first_valid_uid = 1000
namespace inbox {
  inbox = yes
  separator = .
  prefix = INBOX.
  mailbox Sent {
    special_use = \Sent
  }
  mailbox Drafts {
    special_use = \Drafts
  }
  mailbox Trash {
    special_use = \Trash
  }
}

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%u
}

service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
